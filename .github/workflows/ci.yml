name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Warnings are failures: the project has kept a clean build, and a CI that
  # tolerates them is how that stops being true.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # The vendored static library is 12 MB and never changes, so keying the
          # cache on the lockfile keeps rebuilds short without it going stale.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  release:
    name: Release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked

      - name: Stage the asset
        shell: pwsh
        run: |
          # The updater looks for exactly this name in the release assets, so the
          # name is part of the interface and not a detail.
          Copy-Item target/release/myterm.exe myterm.exe

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: myterm.exe
          # The updater reads the tag, so a release without one is invisible to
          # every installed copy.
          generate_release_notes: true
          fail_on_unmatched_files: true
