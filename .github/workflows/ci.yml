name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Warnings are failures: the project has kept a clean build, and a CI that
  # tolerates them is how that stops being true.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # No `key` input. The action already derives one from the rustc version,
      # the target, the job, and the external dependencies in `Cargo.lock` —
      # filtering out workspace members, so a version bump does not count.
      # Adding `hashFiles('**/Cargo.lock')` defeated exactly that: the lockfile
      # records this workspace's own version, so every release wrote a cache
      # under a key the next run never asked for, and restored nothing. The
      # debug and release builds stay apart through `add-job-id-key`, which is
      # what keeps one from evicting the other.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  release:
    name: Release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Stage the asset
        shell: pwsh
        run: |
          # The updater looks for exactly this name in the release assets, so the
          # name is part of the interface and not a detail.
          Copy-Item target/release/myterm.exe myterm.exe

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: myterm.exe
          # The updater reads the tag, so a release without one is invisible to
          # every installed copy.
          generate_release_notes: true
          fail_on_unmatched_files: true
