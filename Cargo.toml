[workspace]
resolver = "3"
members = ["crates/app", "crates/pty", "crates/vt", "crates/vt-sys"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
vt = { path = "crates/vt" }
pty = { path = "crates/pty" }
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
