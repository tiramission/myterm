[package]
name = "nsh-app-myterm"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
env_logger = "0.11"
log = "0.4"
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "4230bfe2e00e081871b45ae14161d77c24304d50", package = "libghostty-vt" }
portable-pty = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }
