<!doctype html>
<!-- myterm 的界面原型：界面与交互以这里为准（0.5.0 已按此实现）。打开即可交互：Ctrl+K 命令面板，Ctrl+, 设置，Ctrl+Shift+F 查找。 -->
<html lang="zh-CN" data-theme="dark" data-accent="lime">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myterm · 新界面原型</title>
<style>
:root{
  --rail-w:238px; --topbar:44px; --status:26px; --row-h:42px; --term-fs:12.5px;
  --font:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
  --mono:"Maple Mono NF CN","Cascadia Code",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
html[data-theme="dark"]{
  --shell:#141715; --shell-2:#191d1a; --bg:#0d0f0e; --surface:#1e2320; --surface2:#252b27;
  /* --line is the pane's edge and nothing else: every other surface in the
     window is separated by fill, shadow or air. --line2 is the focused card's
     step up from it. */
  --text:#e9ece7; --text2:#a3aaa3; --text3:#6c746d; --line:#2a312c; --line2:#39423b;
  --danger:#e0716f; --danger-soft:rgba(224,113,111,.14); --warn:#d9b96a; --pop:#20261f; --scrim:rgba(6,8,7,.55);
}
html[data-theme="light"]{
  --shell:#f2f1ea; --shell-2:#ebeae2; --bg:#ffffff; --surface:#e8e7df; --surface2:#dedcd3;
  --text:#191c19; --text2:#5a6159; --text3:#8a918a; --line:#dcdad1; --line2:#c9c7bd;
  --danger:#bf453f; --danger-soft:rgba(191,69,63,.12); --warn:#9a7420; --pop:#ffffff; --scrim:rgba(30,34,29,.32);
}
html[data-accent="lime"]{--accent:#b9e36c;--accent-soft:rgba(185,227,108,.13);--accent-line:rgba(185,227,108,.42)}
html[data-theme="light"][data-accent="lime"]{--accent:#5c8a20;--accent-soft:rgba(92,138,32,.12);--accent-line:rgba(92,138,32,.4)}
html[data-accent="amber"]{--accent:#e3c06c;--accent-soft:rgba(227,192,108,.13);--accent-line:rgba(227,192,108,.42)}
html[data-theme="light"][data-accent="amber"]{--accent:#8a6a1f;--accent-soft:rgba(138,106,31,.12);--accent-line:rgba(138,106,31,.4)}
html[data-accent="sky"]{--accent:#7cc4e8;--accent-soft:rgba(124,196,232,.13);--accent-line:rgba(124,196,232,.42)}
html[data-theme="light"][data-accent="sky"]{--accent:#1f6a8a;--accent-soft:rgba(31,106,138,.12);--accent-line:rgba(31,106,138,.4)}
html[data-accent="violet"]{--accent:#c9a7f5;--accent-soft:rgba(201,167,245,.13);--accent-line:rgba(201,167,245,.42)}
html[data-theme="light"][data-accent="violet"]{--accent:#6b3fa0;--accent-soft:rgba(107,63,160,.12);--accent-line:rgba(107,63,160,.4)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--shell);color:var(--text);font:12px/1.4 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:default}
select{font:inherit;color:var(--text);background:var(--surface);border:0;border-radius:6px;height:26px;padding:0 6px;outline:0}
a{color:inherit}
#app{height:100%;display:flex;user-select:none}

/* density */
body[data-density="compact"]{--row-h:34px}
body[data-density="standard"]{--row-h:42px}
body[data-density="comfy"]{--row-h:50px}
body[data-density="compact"] .sess-cwd{display:none}

.rail{width:var(--rail-w);flex:0 0 auto;display:flex;flex-direction:column;background:var(--shell);transition:width .18s var(--ease)}
body.narrow{--rail-w:56px}
.rail-top{height:var(--topbar);display:flex;align-items:center;gap:6px;padding:0 10px}
body.narrow .rail-top{justify-content:center;padding:0}
.mark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft);flex:0 0 auto;transition:color .15s,background .15s}
.mark svg{width:15px;height:15px}
.rail-collapse{margin-left:auto;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--text3)}
.rail-collapse:hover{background:var(--surface);color:var(--text)}
body.narrow .rail-collapse{display:none}
.rail-scroll{flex:1;min-height:0;overflow:auto;padding:2px 8px 8px;scrollbar-width:thin;scrollbar-color:var(--surface2) transparent}
.rail-scroll::-webkit-scrollbar{width:8px}
.rail-scroll::-webkit-scrollbar-track{background:transparent}
.rail-scroll::-webkit-scrollbar-thumb{background:transparent;border-radius:99px;border:2px solid transparent;background-clip:content-box}
.rail-scroll:hover::-webkit-scrollbar-thumb{background:var(--surface2)}
.ws{margin-top:6px}
.ws-head{display:flex;align-items:center;gap:7px;width:100%;height:26px;padding:0 6px 0 8px;color:var(--text2);font-size:11px;font-weight:600;border-radius:7px;text-align:left}
.ws-head:hover{background:var(--surface);color:var(--text)}
.ws-head .glyph{color:var(--text3);display:flex}
.ws-head .glyph svg{width:12px;height:12px}
.ws-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-initial{display:none;font-size:11px;font-weight:700;color:var(--text2)}
.ws-count{margin-left:auto;font-size:10px;color:var(--text3);font-variant-numeric:tabular-nums}
.ws-close{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--text3);opacity:0;flex:0 0 auto}
.ws-head:hover .ws-close{opacity:1}
.ws-close:hover{background:var(--surface2);color:var(--text)}
.ws-close svg{width:10px;height:10px}
.sess{display:flex;align-items:center;gap:8px;width:100%;height:var(--row-h);padding:0 6px 0 10px;border-radius:8px;text-align:left;position:relative}
.sess:hover{background:var(--surface)}
.sess.active{background:var(--surface)}
.sess .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.dot.run{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dot.idle{background:var(--text3)}
.dot.exit{background:var(--danger)}
.sess-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.sess-title{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess.active .sess-title{color:var(--text)}
.sess-cwd{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-close{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--text3);opacity:0;flex:0 0 auto}
.sess:hover .sess-close{opacity:1}
.sess-close:hover{background:var(--surface2);color:var(--danger)}
.sess-close svg{width:10px;height:10px}
.init{display:none;font-size:12px;font-weight:600;color:var(--text2)}
.init.run{color:var(--accent)}
.init.exit{color:var(--danger)}
.rail-foot{padding:12px 8px 8px;display:flex;gap:6px}
.new-sess{flex:1;height:30px;border-radius:8px;display:flex;align-items:center;gap:7px;padding:0 9px;color:var(--text2);font-size:11.5px}
.new-sess:hover{background:var(--surface);color:var(--text)}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--text3);flex:0 0 auto}
.icon-btn:hover{background:var(--surface);color:var(--text)}
.icon-btn svg{width:14px;height:14px}

body.narrow .rail-scroll{padding:2px 6px 8px}
body.narrow .ws{margin-top:8px;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:10px;padding:4px 0}
body.narrow .ws-current{background:var(--surface)}
body.narrow .ws-head{width:26px;height:26px;padding:0;justify-content:center;gap:0;border-radius:7px}
body.narrow .ws-head:hover{background:var(--surface2)}
body.narrow .ws-head .glyph,body.narrow .ws-name,body.narrow .ws-count,body.narrow .ws-close{display:none}
body.narrow .ws-initial{display:block}
body.narrow .ws-current .ws-initial{color:var(--accent)}
body.narrow .sess{width:30px;height:30px;padding:0;justify-content:center;gap:0;margin:0 auto}
body.narrow .sess-main,body.narrow .sess-close{display:none}
body.narrow .sess .init{display:block}
body.narrow .sess .dot{position:absolute;top:5px;right:5px;width:5px;height:5px;box-shadow:none}
body.narrow .sess.active{background:var(--surface2)}
body.narrow .rail-foot{flex-direction:column;align-items:center;gap:6px}
body.narrow .new-sess{flex:0 0 30px;width:30px;height:30px;justify-content:center;padding:0}
body.narrow .new-sess span{display:none}

.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--topbar);flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 6px 0 16px;position:relative}
.crumbs{display:flex;align-items:baseline;gap:8px;min-width:0}
.ws-title{font-size:13px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.cwd{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.branch{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:10px}
.cmd-trigger{margin-left:auto;width:300px;height:28px;border-radius:8px;background:var(--surface);display:flex;align-items:center;gap:8px;padding:0 8px;color:var(--text3);font-size:11px}
.cmd-trigger:hover{background:var(--surface2);color:var(--text2)}
.cmd-trigger .grow{flex:1;text-align:left}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:4px;background:var(--surface);color:var(--text3);font-size:9.5px;line-height:1}
.tb-actions{display:flex;gap:2px}
.winbtns{display:flex;gap:2px}
.win{width:42px;height:32px;display:grid;place-items:center;border-radius:7px;color:var(--text2)}
.win:hover{background:var(--surface)}
.win.close:hover{background:var(--danger);color:#fff}

.menu{position:absolute;top:38px;right:56px;min-width:210px;padding:6px;border-radius:12px;background:var(--pop);box-shadow:0 18px 50px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.2);z-index:45}
.menu[hidden]{display:none}
.mitem{display:flex;align-items:center;gap:10px;width:100%;height:31px;padding:0 9px;border-radius:7px;color:var(--text2);font-size:11.5px;text-align:left}
.mitem:hover{background:var(--surface);color:var(--text)}
.mitem .k{margin-left:auto;color:var(--text3);font-size:10px}
.msep{height:8px}

/* install banner */
.installbar{display:flex;align-items:center;gap:10px;margin:0 8px 8px 0;height:38px;padding:0 8px 0 12px;border-radius:10px;background:var(--surface);font-size:11.5px;color:var(--text2)}
.installbar[hidden]{display:none}
.installbar .ib-ico{color:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.installbar .ib-ico svg{width:14px;height:14px}
.installbar .ib-text{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.installbar b{font-weight:600;color:var(--text);white-space:nowrap}
.installbar span{color:var(--text3);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.installbar button{height:24px;padding:0 10px;border-radius:6px;font-size:11px;flex:0 0 auto}
.installbar .ghost{color:var(--text3)}
.installbar .ghost:hover{background:var(--surface2);color:var(--text)}
.installbar .primary{background:var(--accent-soft);color:var(--accent)}
.installbar .primary:hover{background:var(--accent-line);color:var(--accent-ink)}

.workspace{flex:1;min-height:0;display:flex;padding:0 8px 8px 0}
.pane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.16);transition:opacity .16s var(--ease),border-color .16s,box-shadow .16s}
.pane.focus{box-shadow:0 2px 10px rgba(0,0,0,.22)}
.pane.dim{opacity:.84}
.pane.focus{border-color:var(--line2)}
.pane-head{height:30px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 6px 0 11px;color:var(--text2);font-size:11px}
.single .pane-head{display:none}
/* One pane is the whole work area: an edge around it would be drawing a box
   around the view itself. It keeps its shadow, which reads as depth rather than
   as a boundary. */
.single .pane{border-color:transparent;box-shadow:none}
.pane-head .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.pane-title{font-weight:500;color:var(--text2);white-space:nowrap}
.pane.focus .pane-title{color:var(--text)}
.pane-meta{color:var(--text3);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pane-actions{margin-left:auto;display:flex;gap:2px;opacity:0;transition:opacity .12s}
.pane:hover .pane-actions,.pane.focus .pane-actions{opacity:1}
.pa{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--text3)}
.pa:hover{background:var(--surface);color:var(--text)}
.pa.on{background:var(--accent-soft);color:var(--accent)}
.pa svg{width:13px;height:13px}
.term{flex:1;min-height:0;margin:0;padding:10px 13px 14px;overflow:auto;font:var(--term-fs)/1.6 var(--mono);color:var(--text);white-space:pre-wrap;word-break:break-word;user-select:text;scrollbar-width:thin;scrollbar-color:var(--surface2) transparent}
.term::-webkit-scrollbar{width:8px}
.term::-webkit-scrollbar-track{background:transparent}
.term::-webkit-scrollbar-thumb{background:transparent;border-radius:99px;border:2px solid transparent;background-clip:content-box}
.term:hover::-webkit-scrollbar-thumb{background:var(--surface2)}
.term .dim{color:var(--text3)}
.term .g{color:#87b455}.term .b{color:#7aa9d0}.term .y{color:var(--warn)}.term .m{color:#b48ead}.term .err{color:var(--danger)}
html[data-theme="light"] .term .g{color:#4f7a1c}
html[data-theme="light"] .term .b{color:#2f6c96}
html[data-theme="light"] .term .m{color:#8b5a86}
html[data-theme="light"] .pane{box-shadow:0 1px 3px rgba(31,38,26,.10)}
html[data-theme="light"] .pane.focus{box-shadow:0 2px 12px rgba(31,38,26,.14)}
.term mark.hit{background:var(--accent-soft);color:inherit;border-radius:2px}
.term mark.hit.cur{background:var(--accent-line);box-shadow:0 0 0 1px var(--accent)}
.cursor{display:inline-block;background:var(--accent);vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
.cursor.block{width:7px;height:14px}
.cursor.bar{width:2px;height:15px}
.cursor.underline{width:7px;height:2px;vertical-align:-1px}
@keyframes blink{50%{opacity:0}}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text3)}
.empty .big{font-size:13px;color:var(--text2)}
.empty button{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:8px;background:var(--surface);color:var(--text2);font-size:11.5px}
.empty button:hover{background:var(--surface2);color:var(--text)}

.split{flex:1;min-width:0;min-height:0;display:flex}
.split.h{flex-direction:row}
.split.v{flex-direction:column}
.half{display:flex;min-width:0;min-height:0;flex:1 1 0}
.divider{position:relative;flex:0 0 8px;cursor:col-resize}
.split.v>.divider{cursor:row-resize}
.divider::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:26px;transform:translate(-50%,-50%);border-radius:99px;background:var(--accent);opacity:0;transition:opacity .12s}
.split.v>.divider::after{width:26px;height:3px}
.divider:hover::after,.divider.drag::after{opacity:1}

.findbar{display:flex;align-items:center;gap:6px;flex:0 0 auto;height:34px;padding:0 8px 0 11px;background:var(--bg)}
.findbar input{flex:1;min-width:0;height:24px;background:var(--surface);border:0;border-radius:6px;padding:0 8px;color:var(--text);font:11.5px var(--font);outline:0}
.findbar input:focus{background:var(--surface2)}
.findbar .cnt{font-size:10px;color:var(--text3);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.findbar .fn{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--text3);font-size:11px;flex:0 0 auto}
.findbar .fn:hover{background:var(--surface);color:var(--text)}

.status{height:var(--status);flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 10px 0 16px;color:var(--text3);font-size:10.5px}
.status[hidden]{display:none}
.status .lab{display:flex;align-items:center;gap:6px}
.status .spacer{flex:1}

.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px) saturate(.9);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;z-index:50}
.scrim[hidden]{display:none}
.scrim.center{align-items:center;padding-top:0}
.palette{width:580px;max-width:92vw;border-radius:16px;background:var(--pop);box-shadow:0 24px 70px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.24);overflow:hidden}
.palette input{width:100%;height:46px;padding:0 16px;border:0;background:none;outline:0;color:var(--text);font:13px var(--font)}
.palette input::placeholder{color:var(--text3)}
.plist{max-height:340px;overflow:auto;padding:6px;scrollbar-width:thin;scrollbar-color:var(--surface2) transparent}
.plist::-webkit-scrollbar{width:8px}
.plist::-webkit-scrollbar-track{background:transparent}
.plist::-webkit-scrollbar-thumb{background:transparent;border-radius:99px;border:2px solid transparent;background-clip:content-box}
.plist:hover::-webkit-scrollbar-thumb{background:var(--surface2)}
.pgroup{padding:8px 10px 4px;font-size:9.5px;letter-spacing:.06em;color:var(--text3)}
.pitem{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border-radius:8px;color:var(--text2);font-size:12px;text-align:left}
.pitem .ico{width:16px;display:grid;place-items:center;color:var(--text3);flex:0 0 auto}
.pitem .ico svg{width:13px;height:13px}
.pitem .hint{margin-left:auto;color:var(--text3);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.pitem.on{background:var(--accent-soft);color:var(--text)}
.pitem.on .ico{color:var(--accent)}
.pfoot{display:flex;gap:14px;padding:10px 16px 12px;color:var(--text3);font-size:10px}

#confirm .dialog{width:380px;max-width:92vw;border-radius:16px;background:var(--pop);box-shadow:0 24px 70px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.24);padding:20px 20px 16px}
.dtitle{font-size:13.5px;font-weight:650;margin-bottom:6px}
.dbody{font-size:11.5px;color:var(--text2);line-height:1.6}
.dactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dactions button{height:28px;padding:0 14px;border-radius:7px;font-size:11.5px;background:var(--surface);color:var(--text2)}
.dactions button:hover{background:var(--surface)}
.dactions .ok{background:var(--accent-soft);color:var(--accent)}
.dactions .ok.danger{background:var(--danger-soft);color:var(--danger)}

.toast{position:fixed;right:16px;bottom:40px;z-index:60;display:flex;align-items:center;gap:14px;height:38px;padding:0 8px 0 14px;border-radius:10px;background:var(--pop);box-shadow:0 12px 34px rgba(0,0,0,.4);font-size:11.5px;color:var(--text2)}
.toast[hidden]{display:none}
.toast button{height:26px;padding:0 10px;border-radius:6px;color:var(--accent);font-size:11.5px}
.toast button:hover{background:var(--accent-soft)}

.sheet-wrap{position:fixed;inset:0;z-index:55;display:flex;justify-content:flex-end}
.sheet-wrap[hidden]{display:none}
.sheet-scrim{position:absolute;inset:0;background:rgba(0,0,0,.12)}
.sheet{position:relative;width:436px;max-width:94vw;height:100%;background:var(--shell-2);box-shadow:-30px 0 80px rgba(0,0,0,.45);display:flex;flex-direction:column;animation:slidein .18s var(--ease)}
@keyframes slidein{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.sh-head{height:52px;flex:0 0 auto;display:flex;align-items:center;padding:0 10px 0 18px}
.sh-title{font-size:14px;font-weight:650}
.sh-head .icon-btn{margin-left:auto}
.sh-tabs{display:flex;gap:2px;padding:0 14px 10px}
.sh-tabs button{height:28px;padding:0 12px;border-radius:7px;color:var(--text3);font-size:11.5px}
.sh-tabs button:hover{background:var(--surface);color:var(--text2)}
.sh-tabs button.on{background:var(--accent-soft);color:var(--accent)}
.sh-body{flex:1;min-height:0;overflow:auto;padding:0 14px 14px;scrollbar-width:thin;scrollbar-color:var(--surface2) transparent}
.sh-body::-webkit-scrollbar{width:8px}
.sh-body::-webkit-scrollbar-track{background:transparent}
.sh-body::-webkit-scrollbar-thumb{background:transparent;border-radius:99px;border:2px solid transparent;background-clip:content-box}
.sh-body:hover::-webkit-scrollbar-thumb{background:var(--surface2)}
.sgroup{padding:12px 4px 6px;font-size:10px;letter-spacing:.06em;color:var(--text3)}
.srow{display:flex;align-items:center;gap:16px;min-height:52px;padding:10px 8px}
.slabel{flex:1;min-width:0;font-size:12px;color:var(--text2)}
.shint{font-size:10px;color:var(--text3);margin-top:2px;line-height:1.5}
.seg{display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--surface);flex:0 0 auto}
.seg button{height:24px;padding:0 10px;border-radius:6px;color:var(--text3);font-size:11px}
.seg button:hover{color:var(--text2)}
.seg button.on{background:var(--pop);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.swatches{display:flex;gap:8px}
.sw{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.sw.on{box-shadow:0 0 0 2px var(--shell-2),0 0 0 3.5px var(--accent)}
.sw.lime{background:#b9e36c}.sw.amber{background:#e3c06c}.sw.sky{background:#7cc4e8}.sw.violet{background:#c9a7f5}
.stepper{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.stepper button{width:24px;height:24px;border-radius:6px;background:var(--surface);color:var(--text2);font-size:13px;line-height:1}
.stepper button:hover{background:var(--surface2);color:var(--text)}
.stepper .val{min-width:56px;text-align:center;font-size:11.5px;color:var(--text);font-variant-numeric:tabular-nums}
.sh-foot{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px;color:var(--text3);font-size:10.5px}
.sh-foot .link{color:var(--text2);font-size:11px}
.sh-foot .link:hover{color:var(--accent)}
.sh-foot .spacer{flex:1}
.klist{display:flex;flex-direction:column}
.krow{display:flex;align-items:center;gap:10px;height:34px;font-size:11.5px;color:var(--text2)}
.krow .keys{margin-left:auto;display:flex;gap:4px}

.about{width:400px;max-width:92vw;border-radius:16px;background:var(--pop);box-shadow:0 24px 70px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.24);padding:20px}
.ab-top{display:flex;align-items:center;gap:12px}
.ab-mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft);flex:0 0 auto}
.ab-mark svg{width:20px;height:20px}
.ab-name{font-size:14px;font-weight:650}
.ab-sub{font-size:11px;color:var(--text3);margin-top:2px}
.ab-top .icon-btn{margin-left:auto}
.ab-rows{margin:18px 0 4px}
.ab-row{display:flex;align-items:center;height:34px;font-size:11.5px;color:var(--text3)}
.ab-row b{margin-left:auto;font-weight:500;color:var(--text2)}
.ab-actions{display:flex;align-items:center;gap:8px;margin-top:16px}
.ab-actions .ghost{height:28px;padding:0 12px;border-radius:7px;background:var(--surface);color:var(--text2);font-size:11.5px}
.ab-actions .ghost:hover{background:var(--surface);color:var(--text)}
.ab-actions .ghost[hidden]{display:none}
.ab-actions .spacer{flex:1}
.ab-actions .primary{height:28px;padding:0 16px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-size:11.5px}
.ab-actions .primary:hover{background:var(--accent-line);color:var(--accent-ink)}
.ab-foot{margin-top:14px;font-size:10px;color:var(--text3)}
.ab-foot a{color:var(--text2);text-decoration:none}
.ab-foot a:hover{color:var(--accent);text-decoration:underline}

@media (max-width:1080px){ .cmd-trigger{width:200px} }
</style>
</head>

const $ = (s, el = document) => el.querySelector(s);
const icon = {

  unzoom: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 4v3.5A1.5 1.5 0 0 1 7.5 9H4"/><path d="M20 9h-3.5A1.5 1.5 0 0 1 15 7.5V4"/><path d="M15 20v-3.5a1.5 1.5 0 0 1 1.5-1.5H20"/><path d="M4 15h3.5A1.5 1.5 0 0 1 9 16.5V20"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  term: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9.5l3 2.5-3 2.5"/><path d="M12.5 15h4.5"/></svg>',
  split: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M3 12h18"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 13A8 8 0 0 1 9 4a8 8 0 1 0 11 9z"/></svg>',

  find: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',

  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

let uid = 7;
const state = {
  theme:'dark', rail:'wide', find:false, ws:0, zoom:null, menu:false,
  settings:false, stTab:'外观',
  density:'standard', accent:'lime', cursor:'block', termFs:12.5, scrollback:10000, shell:'pwsh',
  integration:'off',
  installed:true, installDismissed:false, update:'latest',
  wsActive:{ '0':'p1', '1':'p4', '2':'p6' },
  workspaces:[
    { id:'w1', name:'myterm', layout:{ t:'split', dir:'h', ratio:.56, a:{ t:'leaf', id:'p1' }, b:{ t:'split', dir:'v', ratio:.52, a:{ t:'leaf', id:'p2' }, b:{ t:'leaf', id:'p3' } } } },
    { id:'w2', name:'日志', layout:{ t:'split', dir:'v', ratio:.5, a:{ t:'leaf', id:'p4' }, b:{ t:'leaf', id:'p5' } } },
    { id:'w3', name:'部署', layout:{ t:'leaf', id:'p6' } }
  ],
  panes:{
    p1:{ title:'cargo run', cwd:'~/myterm', branch:'main', status:'run', lines:[
      '<span class="dim">PS D:\\Codes\\GitHubProjects\\myterm&gt;</span> git status -sb',
      '<span class="g">## main...origin/main</span>',
      '<span class="dim">PS D:\\Codes\\GitHubProjects\\myterm&gt;</span> cargo run -p myterm',

    ]},

      '10.0.0.4  "GET /api/health"  200  1ms',

    ]}
  }
};

const clone = (o) => JSON.parse(JSON.stringify(o));
const leaves = (n) => n.t === 'leaf' ? [n.id] : [...leaves(n.a), ...leaves(n.b)];
const wsLeaves = (w) => leaves(w.layout);
const activeWs = () => state.workspaces[state.ws];
const activeId = () => state.wsActive[String(state.ws)];
const nodeAt = (root, path) => path ? path.split('').reduce((n, k) => k === 'a' ? n.a : n.b, root) : root;
function splitAt(node, id, build) {
  if (node.t === 'leaf') return node.id === id ? build() : node;
  return { ...node, a: splitAt(node.a, id, build), b: splitAt(node.b, id, build) };
}
function removeAt(node, id) {
  if (node.t === 'leaf') return node.id === id ? null : node;
  const a = removeAt(node.a, id), b = removeAt(node.b, id);
  if (!a) return b; if (!b) return a;
  return { ...node, a, b };
}
const dotClass = (s) => s === 'run' ? 'run' : s === 'exit' ? 'exit' : 'idle';
const termHtml = (pane) => pane.lines.join('\n').replace(/<cursor>/g, '<span class="cursor ' + state.cursor + '"></span>');

function paneHtml(id) {
  const pane = state.panes[id];
  const focus = activeId() === id;
  const zoomed = state.zoom === id;
  return `<section class="pane ${focus ? 'focus' : 'dim'}" data-pane="${id}">
    <header class="pane-head">
      <span class="dot ${dotClass(pane.status)}"></span>
      <span class="pane-title">${pane.title}</span>
      <span class="pane-meta">${pane.cwd}${pane.branch ? ' · ' + pane.branch : ''}</span>
      <span class="pane-actions">
        <button class="pa" data-split="h" title="向右分屏">${icon.splitH}</button>

/* find */
function clearHits(term) {
  term.querySelectorAll('mark.hit').forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  term.normalize();
}
function applyFind(q) {
  const term = document.querySelector('.pane.focus .term');
  if (!term) return;
  clearHits(term);
  let n = 0;
  if (q) {
    const lq = q.toLowerCase();
    const walker = document.createTreeWalker(term, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => {
      const text = node.nodeValue;
      const lower = text.toLowerCase();
      let idx = lower.indexOf(lq);
      if (idx < 0) return;
      const frag = document.createDocumentFragment();
      let last = 0;
      while (idx >= 0) {
        frag.appendChild(document.createTextNode(text.slice(last, idx)));
        const m = document.createElement('mark');
        m.className = 'hit' + (n === 0 ? ' cur' : '');
        m.textContent = text.slice(idx, idx + lq.length);
        frag.appendChild(m);
        n++;
        last = idx + lq.length;
        idx = lower.indexOf(lq, last);
      }
      frag.appendChild(document.createTextNode(text.slice(last)));
      node.replaceWith(frag);
    });
  }
  const cnt = $('#findCount');
  if (cnt) cnt.textContent = n ? '1/' + n : '0/0';
  const cur = term.querySelector('mark.hit.cur');
  if (cur) cur.scrollIntoView({ block: 'center' });
}
function stepFind(dir) {
  const term = document.querySelector('.pane.focus .term');
  if (!term) return;
  const hits = [...term.querySelectorAll('mark.hit')];
  if (!hits.length) return;
  let i = hits.findIndex(h => h.classList.contains('cur'));
  if (i < 0) i = 0;
  hits[i].classList.remove('cur');
  i = (i + dir + hits.length) % hits.length;
  hits[i].classList.add('cur');
  hits[i].scrollIntoView({ block: 'center' });
  const cnt = $('#findCount');
  if (cnt) cnt.textContent = (i + 1) + '/' + hits.length;
}

const snapshot = () => ({ workspaces: clone(state.workspaces), wsActive: { ...state.wsActive }, ws: state.ws });
function restore(snap) {
  state.workspaces = clone(snap.workspaces);
  state.wsActive = { ...snap.wsActive };
  state.ws = Math.min(snap.ws, Math.max(0, state.workspaces.length - 1));
  render();
}

let undoSnap = null, toastTimer = null;
function toast(text, snap) {
  $('#toastText').textContent = text;
  $('#toastUndo').hidden = !snap;
  undoSnap = snap || null;
  $('#toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').hidden = true; undoSnap = null; }, 6000);
}

let confirmRun = null;
function showConfirm(title, body, onOk, danger = true) {
  $('#dTitle').textContent = title;
  $('#dBody').textContent = body;
  $('#dOk').classList.toggle('danger', danger);
  confirmRun = onOk;
  $('#confirm').hidden = false;
}

function closeSession(id) {
  const wi = state.workspaces.findIndex(w => wsLeaves(w).includes(id));
  if (wi < 0) return;
  const pane = state.panes[id];
  if (state.zoom === id) state.zoom = null;
  if (pane.status === 'run') {
    showConfirm('关闭「' + pane.title + '」？', '它还在运行，关闭会结束这个进程。', () => doCloseSession(wi, id));
    return;
  }
  doCloseSession(wi, id);
}

function doCloseSession(wi, id) {
  const snap = snapshot();
  const w = state.workspaces[wi];
  const next = removeAt(w.layout, id);
  if (!next) {
    const name = w.name;
    state.workspaces.splice(wi, 1);
    if (state.ws >= state.workspaces.length) state.ws = Math.max(0, state.workspaces.length - 1);
    toast('已关闭工作区「' + name + '」', snap);
  } else {
    w.layout = next;
    if (state.wsActive[String(wi)] === id) state.wsActive[String(wi)] = wsLeaves(w)[0];
    toast('已关闭「' + state.panes[id].title + '」', snap);
  }
  render();
}

function closeWorkspace(i) {
  const w = state.workspaces[i];
  if (!w) return;
  const running = wsLeaves(w).filter(id => state.panes[id].status === 'run').length;
  if (running) {
    showConfirm('关闭工作区「' + w.name + '」？', running + ' 个会话正在运行，关闭会结束这些进程。', () => doCloseWorkspace(i));
    return;
  }
  doCloseWorkspace(i);
}

function doCloseWorkspace(i) {
  const snap = snapshot();
  const name = state.workspaces[i].name;
  state.workspaces.splice(i, 1);
  if (state.ws >= state.workspaces.length) state.ws = Math.max(0, state.workspaces.length - 1);
  state.zoom = null;
  toast('已关闭工作区「' + name + '」', snap);
  render();
}

let dragState = null;

function splitPane(dir) {
  if (!state.workspaces.length) return;
  state.zoom = null;
  const id = activeId();
  const nid = 'p' + (uid++);
  state.panes[nid] = { title:'新会话', cwd: state.panes[id].cwd, branch:'main', status:'idle', lines:['<span class="dim">PS '+state.panes[id].cwd+'&gt;</span> <cursor>'] };
  const w = activeWs();
  w.layout = splitAt(w.layout, id, () => ({ t:'split', dir, ratio:.5, a:{ t:'leaf', id }, b:{ t:'leaf', id:nid } }));

}

function focusPane(ws, id) {
  const ids = wsLeaves(state.workspaces[ws]);

function toggleZoom(id) {
  state.zoom = state.zoom === id ? null : id;

function newWorkspace() {
  const nid = 'p' + (uid++);

function paletteItems(q) {
  const query = q.trim().toLowerCase();
  const cmds = commands.filter(c => !query || c.title.toLowerCase().includes(query))
    .map(c => ({ kind:'cmd', label:c.title, hint:c.hint, ico:c.ico, run:c.run }));
  const sess = [];
  state.workspaces.forEach((w, wi) => wsLeaves(w).forEach(id => {
    const p = state.panes[id];
    if (query && !(p.title + ' ' + p.cwd + ' ' + w.name).toLowerCase().includes(query)) return;
    sess.push({ kind:'sess', label:p.title, hint:w.name + ' · ' + p.cwd, ico:icon.term, run:() => focusPane(wi, id) });
  }));
  return [...cmds, ...sess];
}

let pItems = [], pIndex = 0;

document.addEventListener('click', (e) => {
  if (state.menu && !e.target.closest('#appMenu,#appMenuBtn')) closeMenu();
  const t = e.target.closest('[data-i],[data-tab],[data-seg],[data-step],[data-accent],[data-open-settings],[data-close-settings],[data-open-about],[data-close-about],[data-check-update],[data-uninstall],[data-install-app],[data-install],[data-install-dismiss],[data-quit],[data-find],[data-tb-split],[data-tb-new],[data-empty-new],[data-confirm-ok],[data-confirm-cancel],[data-sess-close],[data-ws-close],[data-closefind],[data-close],[data-split],[data-zoom],[data-pane-id],[data-ws],[data-pane],#cmdTrigger,#themeBtn,#railBtn,#railCollapse,#newSess,#settingsBtn,#appMenuBtn,#appMenu,#palette,#confirm,#settings,#about,#toastUndo');
  if (!t) return;
  if (t.id === 'palette') { if (e.target === t) closePalette(); return; }
  if (t.id === 'confirm') { if (e.target === t) closeConfirm(); return; }
  if (t.id === 'about') { if (e.target === t) closeAbout(); return; }
  if (t.id === 'settings') { if (e.target === t) closeSettings(); return; }
  if (t.id === 'toastUndo') { if (undoSnap) { restore(undoSnap); undoSnap = null; $('#toast').hidden = true; } return; }
  if (t.hasAttribute('data-confirm-ok')) { const fn = confirmRun; closeConfirm(); if (fn) fn(); return; }
  if (t.hasAttribute('data-confirm-cancel')) { closeConfirm(); return; }
  if (t.hasAttribute('data-i')) return runItem(+t.dataset.i);
  if (t.hasAttribute('data-tab')) { state.stTab = t.dataset.tab; renderSettings(); return; }
  if (t.hasAttribute('data-seg')) {
    state[t.dataset.seg] = t.dataset.val;
    if (t.dataset.seg === 'integration') applyIntegration();
    applyLook(); render(); renderSettings(); return;
  }
  if (t.hasAttribute('data-accent')) { state.accent = t.dataset.accent; applyLook(); renderSettings(); return; }
  if (t.hasAttribute('data-step')) {
    const key = t.dataset.step, d = +t.dataset.dir;
    const lo = key === 'termFs' ? 10 : 1000, hi = key === 'termFs' ? 20 : 50000;
    state[key] = Math.round(Math.min(hi, Math.max(lo, state[key] + d)) * 10) / 10;
    applyLook(); renderSettings(); return;
  }
  if (t.hasAttribute('data-find')) { e.stopPropagation(); return stepFind(t.dataset.find === 'next' ? 1 : -1); }
  if (t.hasAttribute('data-open-settings')) { closeMenu(); return openSettings(); }
  if (t.hasAttribute('data-close-settings')) return closeSettings();
  if (t.hasAttribute('data-open-about')) { closeMenu(); return openAbout(); }
  if (t.hasAttribute('data-close-about')) return closeAbout();
  if (t.hasAttribute('data-check-update')) return checkUpdate();
  if (t.hasAttribute('data-uninstall')) return uninstallApp();
  if (t.hasAttribute('data-install-app') || t.hasAttribute('data-install')) return installApp();
  if (t.hasAttribute('data-install-dismiss')) { state.installDismissed = true; renderInstall(); return; }
  if (t.hasAttribute('data-toggle-theme')) { closeMenu(); return toggleTheme(); }
  if (t.hasAttribute('data-quit')) { closeMenu(); toast('原型中不退出应用'); return; }
  if (t.hasAttribute('data-sess-close')) { e.stopPropagation(); return closeSession(t.dataset.sessClose); }
  if (t.hasAttribute('data-ws-close')) { e.stopPropagation(); return closeWorkspace(+t.dataset.wsClose); }
  if (t.id === 'cmdTrigger') return openPalette();
  if (t.id === 'settingsBtn') return openSettings();
  if (t.id === 'appMenuBtn') { state.menu = !state.menu; $('#appMenu').hidden = !state.menu; return; }
  if (t.id === 'themeBtn') return toggleTheme();
  if (t.id === 'railBtn' || t.id === 'railCollapse') return toggleRail();
  if (t.id === 'newSess') return splitPane('h');
  if (t.hasAttribute('data-empty-new')) return newWorkspace();
  if (t.hasAttribute('data-closefind')) { state.find = false; render(); return; }
  if (t.hasAttribute('data-tb-split')) return splitPane(t.dataset.tbSplit);
  if (t.hasAttribute('data-tb-new')) return newWorkspace();
  if (t.hasAttribute('data-zoom')) { e.stopPropagation(); return toggleZoom(t.closest('[data-pane]').dataset.pane); }
  if (t.hasAttribute('data-split')) { e.stopPropagation(); focusPane(state.ws, t.closest('[data-pane]').dataset.pane); splitPane(t.dataset.split); return; }
  if (t.hasAttribute('data-close')) { e.stopPropagation(); closeSession(t.closest('[data-pane]').dataset.pane); return; }
  if (t.hasAttribute('data-pane-id')) return focusPane(+t.dataset.ws, t.dataset.paneId);
  if (t.hasAttribute('data-ws')) return focusPane(+t.dataset.ws, state.wsActive[String(+t.dataset.ws)] || wsLeaves(state.workspaces[+t.dataset.ws])[0]);
  if (t.hasAttribute('data-pane')) return focusPane(state.ws, t.dataset.pane);
});

document.addEventListener('change', (e) => {
  if (e.target.matches('[data-select]')) {
    state[e.target.dataset.select] = e.target.value;
    if (state.settings) renderSettings();
  }
});

document.addEventListener('auxclick', (e) => {
  if (e.button !== 1) return;
  const s = e.target.closest('[data-pane-id]');
  if (!s) return;
  e.preventDefault();
  closeSession(s.dataset.paneId);
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'paletteInput') { pItems = paletteItems(e.target.value); pIndex = 0; renderPalette(); }
  if (e.target.id === 'findInput') applyFind(e.target.value);
});

document.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey;
  const k = e.key.toLowerCase();
  if (e.key === 'Escape') {
    if (!$('#about').hidden) { closeAbout(); return; }
    if (!$('#confirm').hidden) { closeConfirm(); return; }
    if (state.settings) { closeSettings(); return; }
    if (!$('#palette').hidden) { closePalette(); return; }
    if (state.zoom) { state.zoom = null; render(); return; }
    if (state.find) { state.find = false; render(); }
    return;
  }
  if (e.target.id === 'paletteInput') {
    if (e.key === 'ArrowDown') { e.preventDefault(); pIndex = Math.min(pIndex + 1, pItems.length - 1); renderPalette(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); pIndex = Math.max(pIndex - 1, 0); renderPalette(); return; }
    if (e.key === 'Enter') { e.preventDefault(); runItem(pIndex); return; }
  }
  if (e.target.id === 'findInput') {
    if (e.key === 'Enter') { e.preventDefault(); stepFind(e.shiftKey ? -1 : 1); return; }
  }
  if (mod && k === ',') { e.preventDefault(); state.settings ? closeSettings() : openSettings(); return; }
  if (mod && k === 'k') { e.preventDefault(); $('#palette').hidden ? openPalette() : closePalette(); return; }
  if (mod && e.shiftKey && k === 'f') { e.preventDefault(); state.find = !state.find; render(); return; }
  // The browser habit; the product key is Ctrl+Shift+F, because a terminal has
  // to leave Ctrl+F to the shell (forward one character).
  if (mod && k === 'f') { e.preventDefault(); state.find = !state.find; render(); return; }
  if (mod && k === 'tab') { e.preventDefault(); const n = state.workspaces.length; if (n) focusPane((state.ws + (e.shiftKey ? n - 1 : 1)) % n, activeId()); return; }
  // Same for Ctrl+B: readline uses it to move back one character.
  if (mod && k === 'b') { e.preventDefault(); toggleRail(); return; }
  if (mod && e.shiftKey && k === 'l') { e.preventDefault(); toggleTheme(); return; }
  if (mod && e.shiftKey && k === 't') { e.preventDefault(); newWorkspace(); return; }
  if (mod && e.shiftKey && k === 'd') { e.preventDefault(); splitPane('h'); return; }
  if (mod && e.shiftKey && k === 'e') { e.preventDefault(); splitPane('v'); return; }
  if (mod && e.shiftKey && k === 'z') { e.preventDefault(); toggleZoom(activeId()); return; }
  if (mod && e.shiftKey && k === 'w') { e.preventDefault(); closeSession(activeId()); return; }
  if (mod && e.shiftKey && k === 'q') { e.preventDefault(); closeWorkspace(state.ws); return; }
  if ((e.altKey || mod) && /^[1-9]$/.test(e.key)) { const i = +e.key - 1; const target = i === 8 ? state.workspaces.length - 1 : i; if (state.workspaces[target]) focusPane(target, state.wsActive[String(target)] || wsLeaves(state.workspaces[target])[0]); return; }
});

document.addEventListener('pointerdown', (e) => {
  const d = e.target.closest('.divider');
  if (!d) return;
  const split = d.parentElement;
  const node = nodeAt(activeWs().layout, d.dataset.path);
  const rect = split.getBoundingClientRect();
  d.classList.add('drag');
  dragState = { d, a: split.children[0], b: split.children[2], node, rect, dir: node.dir };
  e.preventDefault();
});
document.addEventListener('pointermove', (e) => {
  if (!dragState) return;
  const { rect, dir, a, b } = dragState;
  const p = dir === 'h' ? (e.clientX - rect.left) / rect.width : (e.clientY - rect.top) / rect.height;
  const r = Math.min(.85, Math.max(.15, p));
  a.style.flexGrow = r; b.style.flexGrow = 1 - r;
  dragState.ratio = r;
});
document.addEventListener('pointerup', () => {
  if (!dragState) return;
  dragState.d.classList.remove('drag');
  if (dragState.ratio) dragState.node.ratio = dragState.ratio;
  dragState = null;
});

applyLook();
refreshAbout();
render();
</script>
</body>
</html>
